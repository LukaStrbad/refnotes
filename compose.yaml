services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-0}:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - backend
    restart: always
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    expose:
      - "80"
    restart: always
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    expose:
      - "5000"
    depends_on:
      postgres-db:
        condition: service_healthy
      scheduler-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      AES_KEY: ${AES_KEY}
      AES_IV: ${AES_IV}
      SHA256_KEY: ${SHA256_KEY}
      # This is the path to the volume mounted to /data in the container
      DataDir: /data
    volumes:
      - ${APPSETTINGS_PATH}:/app/appsettings.Production.json:ro
      - refnotes-data:/data
    restart: on-failure:3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  migrations:
    build:
      context: .
      dockerfile: ./docker/migrationservice/Dockerfile
    volumes:
      - ${APPSETTINGS_PATH}:/app/appsettings.Production.json:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      scheduler-db:
        condition: service_healthy
    networks:
      - internal

  postgres-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-refnotes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_USER: ${DB_USER:-postgres}
    ports:
      - "${DB_EXPOSE_PORT:-0}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  scheduler-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE_SCHEDULER:-scheduler}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SCHEDULER:-root}
      POSTGRES_USER: ${DB_USER_SCHEDULER:-postgres}
    ports:
      - "${DB_EXPOSE_PORT_SCHEDULER:-0}:5432"
    volumes:
      - scheduler-postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_SCHEDULER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:8.0.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres-data:
  scheduler-postgres-data:
  caddy-data:
  caddy-config:
  refnotes-data:

networks:
  internal:
